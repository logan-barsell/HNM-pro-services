# Sync Google Place reviews into the static site content file, then commit
# when there are changes. Pair with your existing deploy-on-push workflow.
#
# GitHub secrets required:
#   GOOGLE_PLACES_API_KEY
#
# Also set placeId (and optional URLs) in:
#   src/content/googleReviews.config.js

name: Sync Google Reviews

on:
  schedule:
    # Mondays 14:00 UTC
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync reviews from Google Places
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: npm run sync:reviews

      - name: Commit updated reviews when changed
        run: |
          if git diff --quiet -- src/content/googleReviews.generated.json; then
            echo "No review changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/googleReviews.generated.json
          git commit -m "chore: sync Google reviews"
          git push
